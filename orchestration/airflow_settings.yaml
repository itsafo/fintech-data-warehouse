# Auto-loaded by `astro dev start` into the local Airflow metadata DB.
# conn_host values are Docker container names on data_platform_net
# (created by Terraform), not "localhost" -- these containers reach
# Postgres/MinIO over the shared network, not the host-published ports.
#
# conn_login/conn_password for minio_bronze are placeholders -- replace
# with the real values from `terraform output minio_pipeline_writer_access_key`
# / `terraform output -raw minio_pipeline_writer_secret_key` after
# `terraform apply` (see README "Bootstrap" step 1). They're generated by
# Terraform, not knowable ahead of time like the Postgres dev_user/dev_password.
airflow:
  connections:
    - conn_id: local_warehouse
      conn_type: postgres
      conn_host: local_warehouse
      conn_schema: warehouse
      conn_login: dev_user
      conn_password: dev_password
      conn_port: 5432
    - conn_id: minio_bronze
      conn_type: generic
      conn_host: minio
      conn_port: 9000
      conn_login: REPLACE_WITH_TERRAFORM_OUTPUT_ACCESS_KEY
      conn_password: REPLACE_WITH_TERRAFORM_OUTPUT_SECRET_KEY
      conn_extra:
        bucket: bronze-raw
  variables: []
  pools: []

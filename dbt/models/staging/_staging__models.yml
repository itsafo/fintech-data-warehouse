version: 2

models:
  - name: stg_weather
    description: One row per city per day, lightly typed/renamed from bronze.raw_weather.
    columns:
      - name: city
        tests: [not_null]
      - name: temperature_c
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: -90
              max_value: 60
      - name: windspeed_kmh
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 500
      - name: extracted_date
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [city, extracted_date]

  - name: stg_crypto_prices
    description: Full-grain, one row per (coin, vs_currency) per poll -- not deduped, unlike weather/fx. See the model's own comment for why.
    columns:
      - name: coin_id
        tests:
          - not_null
          - accepted_values:
              values: ['BTC', 'ETH', 'SOL']
      - name: price
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              strictly: true
      - name: captured_at
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [coin_id, vs_currency, captured_at]

  - name: stg_fx_rates
    description: One row per currency pair per day, lightly typed/renamed from bronze.raw_fx.
    columns:
      - name: base_currency
        tests: [not_null]
      - name: quote_currency
        tests:
          - not_null
          - accepted_values:
              values: ['GBP', 'EUR', 'JPY']
      - name: rate
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              strictly: true
      - name: extracted_date
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [base_currency, quote_currency, extracted_date]

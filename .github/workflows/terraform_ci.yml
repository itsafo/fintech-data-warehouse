name: Terraform CI

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_ci.yml"

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # An override file's backend replaces main.tf's `cloud` block, so CI
      # plans against empty local state: no TFC token, no secrets, nothing
      # live. (`init -backend=false` can't be followed by a plan at all.)
      # -lockfile=readonly fails the job if .terraform.lock.hcl is stale.
      - name: terraform init (local backend)
        run: |
          printf 'terraform {\n  backend "local" {}\n}\n' > ci_override.tf
          terraform init -input=false -lockfile=readonly

      - name: terraform validate
        run: terraform validate

      # A from-scratch plan of each environment: catches bad var types,
      # cycles and per-workspace naming bugs. Every resource is a create,
      # so no provider has to reach Docker, Postgres or MinIO.
      - name: terraform plan (dev)
        run: terraform plan -input=false -var-file=environments/dev.tfvars

      - name: terraform plan (prod)
        run: |
          terraform workspace select -or-create prod
          terraform plan -input=false -var-file=environments/prod.tfvars
